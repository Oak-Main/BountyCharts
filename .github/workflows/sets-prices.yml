name: Set prices

# Keeps the set pages' price columns current.
#
# The prices come from TCGCSV, which mirrors TCGplayer's catalogue as one
# JSON file per set ("group"). SetSealed's nightly ingest reads the same
# files, so the two sites cannot publish different numbers for the same
# product. See scripts/fetch_tcgcsv.py for the shared URL, the shared
# one-row-per-product rule, and the shared cents conversion.
#
# This workflow never merges and never deploys. It refreshes the data file,
# renders the pages, and opens (or updates) a DRAFT pull request. Merging is
# the owner's call, and a merge to main is what triggers the deploy.

on:
  schedule:
    # Release day: 06:00 America/Los_Angeles on Friday 2026-11-06.
    #
    # US daylight time ended on 2026-11-01, so Los Angeles is on PST
    # (UTC-8) on release day, not PDT (UTC-7): 06:00 local is 14:00 UTC.
    # Cron has no year field. The schedule job limits this extra run to 2026.
    - cron: "0 14 6 11 *"

    # Nightly, 21:30 UTC. The same slot SetSealed's TCGCSV ingest runs in
    # ("30 21 * * *" in its wrangler.jsonc), so both sites read the same
    # refreshed file inside the same window and stay in agreement.
    - cron: "30 21 * * *"

  workflow_dispatch:
    inputs:
      set:
        description: "Set slug to refresh (blank = every set)"
        required: false
        default: ""

concurrency:
  group: set-prices
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$TRIGGER_CRON" == '0 14 6 11 *' && "$(date -u +%F)" != 2026-11-06 ]]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
  refresh:
    needs: schedule
    if: needs.schedule.outputs.due == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REVIEW_BRANCH: ${{ inputs.set && format('chore/set-prices-{0}', inputs.set) || 'chore/set-prices' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Find the reserved draft
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json number,isDraft,headRefOid --jq '.[0] // empty')
          if [[ -n "$pr" ]]; then
            jq -e '.isDraft' <<< "$pr" > /dev/null || { echo "::error::Price PR is ready for review"; exit 1; }
            echo "number=$(jq -r .number <<< "$pr")" >> "$GITHUB_OUTPUT"
            echo "head=$(jq -r .headRefOid <<< "$pr")" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch TCGCSV prices
        env:
          SET_SLUG: ${{ inputs.set }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          DRAFT_NUMBER: ${{ steps.review.outputs.number }}
        run: |
          args=(--set "$SET_SLUG")
          if [[ "$EVENT_NAME" == workflow_dispatch || "$TRIGGER_CRON" == '0 14 6 11 *' || -n "$DRAFT_NUMBER" ]]; then
            args+=(--rebuild)
          fi
          python3 scripts/fetch_tcgcsv.py "${args[@]}"

      - name: Render the set pages
        run: python3 scripts/build_sets.py

      - name: Validate site
        run: python3 scripts/validate_site.py

      - name: Test the gate
        run: python3 -m unittest discover -s tests -v

      - name: Record the validated tree and protect reviews in progress
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.review.outputs.number }}
        run: |
          git add -- data/sets site/sets site/sitemap.xml
          tree=$(git write-tree)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            if [[ -n "$PR_NUMBER" ]]; then
              git fetch --no-tags --depth=1 origin "refs/heads/$REVIEW_BRANCH"
              test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" || { echo "::error::Existing draft diverges from the verified unchanged snapshot."; exit 1; }
            fi
            echo "No change from main. No price update to review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ready=$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json isDraft --jq 'any(.[]; .isDraft == false)')
          if [[ "$ready" == true ]]; then
            echo "::error::The previous price update is ready for review. Its branch was preserved."
            exit 1
          fi
          git reset --quiet HEAD -- data/sets site/sets site/sitemap.xml
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Update an existing draft with the validated tree
        if: steps.candidate.outputs.changed == 'true' && steps.review.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.review.outputs.number }}
          PREVIOUS_HEAD: ${{ steps.review.outputs.head }}
          TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid)
          jq -e --arg sha "$PREVIOUS_HEAD" '.state == "OPEN" and .isDraft and .headRefOid == $sha' <<< "$pr" > /dev/null
          git fetch --no-tags --depth=1 origin "refs/heads/$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PREVIOUS_HEAD"
          test "$(git show --no-patch --format=%ce FETCH_HEAD)" = '41898282+github-actions[bot]@users.noreply.github.com'
          paths=$(gh pr diff "$PR_NUMBER" --name-only)
          if grep -Ev '^(data/sets/[^/]+\.json|site/sets/[^/]+\.html|site/sitemap\.xml)$' <<< "$paths" | grep -q .; then
            echo "::error::Reserved draft contains changes outside the price snapshot."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          head=$(git commit-tree "$TREE" -p "$GITHUB_SHA" -m 'chore(sets): refresh TCGCSV prices')
          ref="refs/heads/$REVIEW_BRANCH"
          git push --force-with-lease="$ref:$PREVIOUS_HEAD" origin "$head:$ref"

      - name: Open a new draft pull request
        id: open_draft
        if: steps.candidate.outputs.changed == 'true' && steps.review.outputs.number == ''
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: ${{ env.REVIEW_BRANCH }}
          delete-branch: false
          commit-message: "chore(sets): refresh TCGCSV prices"
          title: "chore(sets): refresh TCGCSV prices"
          body: |
            Automated price refresh for the set pages.

            Prices come from TCGCSV, the same source SetSealed's nightly
            ingest reads. The data records the source feed update and the
            time BountyCharts retrieved the snapshot separately.

            This is a draft. Merging it is the owner's decision.
          draft: true
          add-paths: |
            data/sets
            site/sets
            site/sitemap.xml

      # Oak-Main restricts PR creation by GITHUB_TOKEN. The action can still
      # push a review branch. Hand off only the exact validated candidate.
      - name: Verify the review branch and record draft status
        if: steps.candidate.outputs.changed == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TREE: ${{ steps.candidate.outputs.tree }}
          PR_NUMBER: ${{ steps.review.outputs.number }}
          OPEN_OUTCOME: ${{ steps.open_draft.outcome }}
        run: |
          set -euo pipefail
          # A successful force-with-lease can precede the PR API's head update.
          # Observe again without writing to the ref or changing review state.
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            git fetch --no-tags --depth=2 origin "refs/heads/$REVIEW_BRANCH" || continue
            head=$(git rev-parse FETCH_HEAD)
            parent=$(git cat-file -p "$head" | sed -n '/^$/q; s/^parent //p')
            if [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$EXPECTED_TREE" || "$parent" != "$GITHUB_SHA" ]]; then
              echo "Waiting for the validated branch tree and parent."
              continue
            fi
            if [[ -n "$PR_NUMBER" ]]; then
              pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER") || continue
            else
              pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=main \
                -f "head=$GITHUB_REPOSITORY_OWNER:$REVIEW_BRANCH" --jq '.[0] // empty') || continue
            fi
            if [[ -z "$pr" && -z "$PR_NUMBER" && "$OPEN_OUTCOME" == failure ]]; then
              status=DRAFT_REQUIRED
            elif [[ -n "$pr" ]] && jq -e --arg sha "$head" --arg branch "$REVIEW_BRANCH" --arg repo "$GITHUB_REPOSITORY" \
              '.state == "open" and .draft and .base.ref == "main" and .head.ref == $branch and .head.repo.full_name == $repo and .head.sha == $sha' <<< "$pr" >/dev/null; then
              status=DRAFT_OPEN
            else
              echo "Waiting for the draft PR to report branch head $head."
              continue
            fi
            echo "$status branch=$REVIEW_BRANCH base=$GITHUB_SHA head=$head tree=$EXPECTED_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          done
          echo "::error::Could not verify the validated ref and draft state after six read attempts."
          exit 1
