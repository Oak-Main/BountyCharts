name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/validate_site.py'
      - 'scripts/verify_live_set.py'
      - 'scripts/build_sets.py'
      - 'scripts/fetch_tcgcsv.py'
      - 'scripts/legal_pages.py'
      - 'legal/**'
      - 'tests/**'
      - 'models/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/sets-prices.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/validate_site.py'
      - 'scripts/verify_live_set.py'
      - 'scripts/build_sets.py'
      - 'scripts/fetch_tcgcsv.py'
      - 'scripts/legal_pages.py'
      - 'legal/**'
      - 'tests/**'
      - 'models/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/sets-prices.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real gate. Runs everywhere, needs no credentials, and blocks deploy.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Drift check on the COMMITTED tree, before anything re-renders it. The
      # render step below overwrites site/, so a drift test run after it would
      # compare the builder's output with itself and could never fail.
      - name: Committed pages match their data
        run: python3 -m unittest tests.test_build_sets.TheCommittedPageMatchesTheDataFile -v

      # The set pages are rendered from data/sets/*.json. Rendering before
      # the gate means the gate checks the page that would actually ship,
      # and a data file that was edited without rebuilding cannot reach
      # production out of step with its own source.
      - name: Render the set pages
        run: python3 scripts/build_sets.py

      - name: Validate site
        run: python3 scripts/validate_site.py

      - name: Legal pages (fail closed while any token is unresolved)
        run: python3 scripts/legal_pages.py --check

      # Nothing tested the gate itself until now, so a change to
      # validate_site.py could silently stop catching things.
      - name: Test the gate
        run: python3 -m unittest discover -s tests -v

      # models/unit_economics.py is the file README points at for every revenue
      # figure in the deep dive, and it had no check of any kind. This is a
      # smoke test, not a proof: it asserts the documented invocations still
      # run and still produce all three revenue lines.
      - name: Smoke-test the unit-economics model
        run: |
          set -euo pipefail
          python3 models/unit_economics.py > /tmp/baseline.txt
          python3 models/unit_economics.py --first-click-win-rate 1.0 > /dev/null
          python3 models/unit_economics.py --digital-share 0.8 --sessions 100000 > /dev/null
          grep -q 'Affiliate' /tmp/baseline.txt
          grep -q 'Subscriber LTV' /tmp/baseline.txt

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same render the gate ran, so the published tree is the tree that
      # passed the gate.
      - name: Render the set pages
        run: python3 scripts/build_sets.py

      # Cloudflare credentials are owner-supplied and may not exist yet. Absent
      # credentials mean "not configured", not "broken" — so detect and skip
      # rather than failing the check. Deploy starts automatically once the
      # secrets are added; no workflow edit needed.
      - name: Legal pages (fail closed while any token is unresolved)
        run: python3 scripts/legal_pages.py --check

      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pushes to main go to production; PRs get a preview URL.
          command: pages deploy site --project-name=bountycharts --branch=${{ github.head_ref || github.ref_name }}

      - name: Report skipped deploy
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo "::notice title=Direct upload skipped::Cloudflare Pages Git integration handles the deployment. Production pushes are verified against the custom domain below."

      - name: Verify Delta Reign on the production domain
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && steps.creds.outputs.ready == 'true'))
        run: python3 scripts/verify_live_set.py delta-reign
